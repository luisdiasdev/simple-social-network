name: Build and Test Workflow

on: push

permissions:
  contents: read

jobs:
  build:
    if: github.actor != 'dependabot'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5.0.0
    - name: Set up JDK 21
      uses: actions/setup-java@v5.0.0
      with:
        java-version: '21'
        distribution: 'adopt'
        cache: maven
        cache-dependency-path: |
          backend/pom.xml
          backend/mvwn*
          backend/.mvn/maven-wrapper*
          backend/.mvn/MavenWrapper*
    - name: Build & Test
      working-directory: ./backend
      run: ./mvnw clean install